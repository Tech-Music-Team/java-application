<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%); padding:32px 40px;">
              <h1 style="margin:0; color:#ffffff; font-size:24px; line-height:1.3;">🎉 Seu evento é amanhã!</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:40px;">
              <p style="margin:0 0 16px; color:#333333; font-size:16px; line-height:1.6;">Olá! 👋</p>
              <p style="margin:0 0 24px; color:#333333; font-size:16px; line-height:1.6;">
                Passando para lembrar que o evento abaixo acontecerá <strong>amanhã</strong>. Fique atento e não perca!
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; border-radius:8px; border-left:4px solid #2575fc;">
                <tr>
                  <td style="padding:20px 24px;">
                    <span style="display:block; color:#888888; font-size:13px; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Evento</span>
                    <span style="display:block; color:#1a1a1a; font-size:20px; font-weight:bold;">{{nomeEvento}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0; color:#555555; font-size:15px; line-height:1.6;">Nos vemos lá! 🚀</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#fafafa; padding:24px 40px; border-top:1px solid #eeeeee;">
              <p style="margin:0; color:#999999; font-size:12px; line-height:1.5; text-align:center;">
                Este é um e-mail automático de lembrete. Por favor, não responda.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
